name: Deploy to IONOS

# IONOS shared hosting has no Node.js runtime, so nothing is built on the
# server. GitHub Actions runs `next build` here, and only the static output in
# out/ is uploaded to the webspace over SFTP.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Connect and list the webspace, but upload nothing"
        type: boolean
        default: false

# One deploy at a time. Two overlapping uploads to the same webspace would
# interleave files and could leave the live site half-updated.
concurrency:
  group: deploy-ionos
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # These are compiled into the bundle, so they must be present at BUILD
      # time — setting them later changes nothing until the next build. They
      # are repository *variables*, not secrets: both are public by design
      # (see .env.local.example). The real secret lives in the Apps Script.
      - name: Build static export
        env:
          NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.NEXT_PUBLIC_CONTACT_ENDPOINT }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: npm run build

      - name: Fail if the export looks wrong
        run: |
          test -f out/index.html
          test -f out/services/index.html
          test -f out/contact/index.html
          test -f out/sitemap.xml
          # A production build must be indexable. If robots says Disallow: /
          # the build picked up NEXT_PUBLIC_SITE_NOINDEX, or SHOULD_INDEX
          # regressed — either way, do not publish it.
          grep -q "Allow: /" out/robots.txt

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Runs on every deploy. A deploy that "succeeds" while the live site
      # never changes almost always means the target directory is wrong, and
      # this is what makes that visible instead of mysterious.
      - name: Inspect target directory
        env:
          IONOS_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          IONOS_USER: ${{ secrets.IONOS_SFTP_USER }}
          IONOS_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          IONOS_REMOTE_DIR: ${{ vars.IONOS_REMOTE_DIR }}
        run: |
          echo "Uploading into: $IONOS_REMOTE_DIR"
          lftp -c "
            set sftp:auto-confirm yes;
            open -u \"$IONOS_USER\",\"$IONOS_PASSWORD\" sftp://$IONOS_HOST;
            cls -l \"$IONOS_REMOTE_DIR\";
          "

      - name: Upload to IONOS webspace
        if: ${{ !inputs.dry_run }}
        env:
          IONOS_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          IONOS_USER: ${{ secrets.IONOS_SFTP_USER }}
          IONOS_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          # A variable, not a secret: secrets are masked in logs, and seeing
          # the actual upload path is the whole game when a deploy "succeeds"
          # but the live site doesn't change.
          IONOS_REMOTE_DIR: ${{ vars.IONOS_REMOTE_DIR }}
        run: |
          # No --delete: mirroring without it only adds and overwrites, so a
          # wrong IONOS_REMOTE_DIR cannot wipe the webspace. Once the target
          # path is confirmed correct, add --delete to clear removed files.
          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            open -u \"$IONOS_USER\",\"$IONOS_PASSWORD\" sftp://$IONOS_HOST;
            mirror -R --verbose --parallel=4 out/ \"$IONOS_REMOTE_DIR\";
          "
